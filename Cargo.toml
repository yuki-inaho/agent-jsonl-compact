[package]
name = "agent-jsonl-compact"
version = "0.3.1"
edition = "2021"
rust-version = "1.74"
description = "Compact OpenAI Codex CLI, Anthropic Claude Code, and OpenCode session JSONL into clean JSONL, Markdown, and summary JSON."
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# MSRV 1.74 pin (root decision PRESERVE 1.74): this exact version is known to build on 1.74.
# No claim is made that it is the newest compatible release.
time = { version = "=0.3.36", features = ["parsing", "formatting"] }
# clap 4.6.x uses edition 2024 (requires rustc 1.85), so pin the known 1.74-compatible line.
clap = { version = ">=4.5.20, <4.6", features = ["derive"] }

[dev-dependencies]
# MSRV 1.74 pin: newer tempfile pulls getrandom 0.4 (edition 2024).
tempfile = "=3.10.1"

[profile.release]
strip = true
