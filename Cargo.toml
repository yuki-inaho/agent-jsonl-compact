[package]
name = "agent-jsonl-compact"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Compact OpenAI Codex CLI rollout JSONL and Anthropic Claude Code transcript JSONL into clean JSONL, Markdown, and summary JSON."
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
