[package]
name = "agent-jsonl-compact"
version = "0.5.1"
edition = "2021"
rust-version = "1.88"
description = "Compact OpenAI Codex CLI, Anthropic Claude Code, and OpenCode session JSONL into clean JSONL, Markdown, and summary JSON."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
libc = "0.2"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
# Patched floor for RUSTSEC-2026-0009. The locked graph is tested on the MSRV.
time = { version = "0.3.47", features = ["parsing", "formatting"] }
clap = { version = "4.5.20", features = ["derive"] }

[profile.release]
strip = true
