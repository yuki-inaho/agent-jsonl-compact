name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test minimum supported Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 test --locked

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust (stable + rustfmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Docs language pairs
        run: bash scripts/check-docs.sh

      - name: Installer safety
        run: |
          shellcheck install.sh
          python3 -m unittest discover -s tests -p 'test_installer.py' -v

  macos-test:
    name: macos (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust (stable + target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Test (native macOS)
        run: cargo test --locked

      - name: Test installer with native archive tools
        run: python3 -m unittest discover -s tests -p 'test_installer.py' -v

      - name: Build (release)
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Smoke test release binary
        run: bash scripts/smoke-release.sh "target/${{ matrix.target }}/release/agent-jsonl-compact"
