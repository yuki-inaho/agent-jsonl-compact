name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install dependency auditor
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Check Cargo.lock against RustSec (including warnings)
        run: cargo audit --deny warnings
      - name: Check installer shell
        run: shellcheck install.sh
      - name: Test installer with synthetic releases (offline)
        run: python3 -m unittest discover -s tests -p 'test_installer.py' -v
      - name: Test file and skill installation boundaries
        run: cargo test --locked --test security
