name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  build:
    needs: security
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      BIN: agent-jsonl-compact
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable + target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --locked --release --target "$TARGET"

      - name: Smoke test release binary
        shell: bash
        run: bash scripts/smoke-release.sh "target/${TARGET}/release/${BIN}"

      - name: Package tarball + checksum
        shell: bash
        run: |
          set -euo pipefail
          dist="${BIN}-${TARGET}"
          mkdir -p "stage/${dist}" dist
          cp "target/${TARGET}/release/${BIN}" "stage/${dist}/"
          cp README.md LICENSE "stage/${dist}/"
          tar -C stage -czf "dist/${dist}.tar.gz" "${dist}"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256" )
          fi
          ls -la dist

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BIN }}-${{ env.TARGET }}
          path: dist/*
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    name: publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
