name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      BIN: agent-jsonl-compact
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target "$TARGET"

      - name: Smoke test release binary
        shell: bash
        run: bash scripts/smoke-release.sh "target/${TARGET}/release/${BIN}"

      - name: Package tarball + checksum
        shell: bash
        run: |
          set -euo pipefail
          dist="${BIN}-${TARGET}"
          mkdir -p "stage/${dist}" dist
          cp "target/${TARGET}/release/${BIN}" "stage/${dist}/"
          cp README.md LICENSE "stage/${dist}/"
          tar -C stage -czf "dist/${dist}.tar.gz" "${dist}"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256" )
          fi
          ls -la dist

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ env.TARGET }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
