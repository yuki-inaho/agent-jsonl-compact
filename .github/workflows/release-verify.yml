name: release-verify

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (default: latest)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.target }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      GH_TOKEN: ${{ github.token }}
      BIN: agent-jsonl-compact
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="${{ github.event.workflow_run.head_branch }}"
            case "$tag" in
              v*) : ;;
              *) tag="$(gh release view --json tagName -q .tagName)" ;;
            esac
          else
            tag="${{ inputs.tag }}"
            if [ -z "$tag" ]; then
              tag="$(gh release view --json tagName -q .tagName)"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "verifying $tag"

      - name: Download release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ steps.tag.outputs.tag }}" --dir dist \
            --pattern '*.tar.gz' --pattern '*.sha256'
          ls -la dist

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c ./*.sha256
          else
            shasum -a 256 -c ./*.sha256
          fi

      - name: Extract and smoke test the published binary
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "dist/${BIN}-${TARGET}.tar.gz" -C dist
          bash scripts/smoke-release.sh "dist/${BIN}-${TARGET}/${BIN}"
